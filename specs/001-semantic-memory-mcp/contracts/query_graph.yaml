openapi: 3.0.0
info:
  title: query_graph
  version: 1.0.0
paths:
  /query_graph:
    post:
      summary: Queries the knowledge graph using SPARQL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  format: sparql
      responses:
        '200':
          description: Query results.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
