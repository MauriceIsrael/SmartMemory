openapi: 3.0.0
info:
  title: "Smart Memory - Supervision API Extensions"
  version: "1.0.0"
  description: "API extensions for the supervision dashboard, including real-time updates."

paths:
  /api/v1/graph/updates:
    get:
      summary: "Subscribe to Graph Updates"
      description: |
        Establishes a Server-Sent Events (SSE) connection to receive real-time
        updates from the knowledge graph. The stream will send an event whenever
        a new fact is added (either by a user or by the inference engine).
      operationId: "subscribeToGraphUpdates"
      tags:
        - "Supervision"
      responses:
        '200':
          description: |
            A successful connection that will stream events.
            The `content-type` will be `text/event-stream`.
            Each event will be named `graph_update` and will contain a JSON payload
            as described in the `GraphUpdateEvent` schema.
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event: graph_update
                  data: {"type": "fact_added", "data": {"subject": "user:1", "predicate": "foaf:knows", "object": "user:2", "metadata": {"id": "123", "is_inferred": false}}}

components:
  schemas:
    GraphUpdateEvent:
      type: object
      properties:
        type:
          type: string
          description: "The type of event, e.g., 'fact_added'."
          example: "fact_added"
        data:
          $ref: '#/components/schemas/FactData'
    FactData:
      type: object
      properties:
        subject:
          type: string
          description: "The subject of the triple."
        predicate:
          type: string
          description: "The predicate of the triple."
        object:
          type: string
          description: "The object of the triple."
        metadata:
          $ref: '#/components/schemas/FactMetadata'
    FactMetadata:
      type: object
      properties:
        id:
          type: string
          description: "The unique ID of the fact."
        is_inferred:
          type: boolean
          description: "True if the fact was generated by the inference engine."

