[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantic-memory-mcp"
version = "0.1.0"
description = "Active knowledge graph MCP server with automatic inference"
requires-python = ">=3.11"
dependencies = [
    "mcp>=0.9.0",
    "rdflib>=7.0.0",
    "owlrl>=6.0.2",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.5.0",
    "black>=23.7.0",
    "ruff>=0.0.284",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_memory"]
